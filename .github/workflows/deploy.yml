name: Django CI/CD

on:
  push:
    branches: [feature-docker]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql postgresql-contrib redis-server
        sudo systemctl start postgresql
        sudo systemctl start redis

    - name: Setup PostgreSQL database
      run: |
        sudo -u postgres psql -c "CREATE DATABASE test_db;"
        sudo -u postgres psql -c "CREATE USER test_user WITH PASSWORD 'test123';"
        sudo -u postgres psql -c "ALTER USER test_user CREATEDB;"
        sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE test_db TO test_user;"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        DEBUG: True
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: test_db
        DB_USER: test_user
        DB_PASSWORD: test123
        DB_HOST: localhost
        DB_PORT: 5432
        ALLOWED_HOSTS: localhost,127.0.0.1
        CELERY_BROKER_URL: redis://localhost:6379/0
      run: |
        python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature-docker'

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/appuser/project
          git pull origin feature-docker
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          sudo systemctl restart gunicorn
          sudo systemctl restart nginx
