name: Django CI/CD with Docker

on:
  push:
    branches: [feature-docker]
  pull_request:
    branches: [develop]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/habits-tracker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
        docker build -t ${{ env.DOCKER_IMAGE }}:latest .

    - name: Push Docker image
      run: |
        docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        docker push ${{ env.DOCKER_IMAGE }}:latest

    - name: Create SSH key file
      run: |
        # Создаем файл с ключом
        echo "$SSH_PRIVATE_KEY" > deploy_key
        
        # Проверяем начало и конец (первые/последние 20 символов без маскировки)
        echo "Начало ключа (hex):"
        head -c 20 deploy_key | xxd -p
        echo "Конец ключа (hex):"
        tail -c 20 deploy_key | xxd -p
        
        # Проверяем структуру
        echo "Первая строка:"
        head -1 deploy_key
        echo "Последняя строка:"
        tail -1 deploy_key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/feature-docker'
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/appuser/project
          git pull origin feature-docker
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          sudo systemctl restart gunicorn
          sudo systemctl restart nginx
