name: Django CI/CD Pipeline

on:
  push:
    branches: [feature-docker]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Create .env file for tests
      run: |
        echo "SECRET_KEY=test-secret-key" > .env
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> .env

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup test database
      run: |
        sudo service postgresql start
        sudo -u postgres psql -c "CREATE DATABASE test_db;"
        sudo -u postgres psql -c "CREATE USER test_user WITH PASSWORD 'test_pass';"
        sudo -u postgres psql -c "ALTER ROLE test_user SET client_encoding TO 'utf8';"
        sudo -u postgres psql -c "ALTER ROLE test_user SET default_transaction_isolation TO 'read committed';"
        sudo -u postgres psql -c "ALTER ROLE test_user SET timezone TO 'UTC';"
        sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE test_db TO test_user;"

    - name: Update .env with correct credentials
      run: |
        echo "DATABASE_URL=postgresql://test_user:test_pass@localhost:5432/test_db" >> .env

    - name: Run migrations
      run: python manage.py migrate

    - name: Run tests
      run: python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/feature-docker'

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/appuser/project
          git pull origin feature-docker
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          sudo systemctl restart gunicorn
          sudo systemctl restart nginx
