name: Django CI/CD with Docker

on:
  push:
    branches: [feature-docker]
  pull_request:
    branches: [develop]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/habits-tracker

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      run: |
        black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Setup PostgreSQL for tests
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql postgresql-contrib
        sudo service postgresql start
        sudo -u postgres psql -c "CREATE DATABASE habits_tracker;"
        sudo -u postgres psql -c "CREATE USER runner WITH SUPERUSER;"
        sudo -u postgres psql -c "ALTER USER runner WITH PASSWORD 'runner';"
        sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE habits_tracker TO runner;"

    - name: Create .env for tests
      run: |
        echo "SECRET_KEY=test-key-123" > .env
        echo "DEBUG=True" >> .env
        echo "DB_NAME=habits_tracker" >> .env
        echo "DB_USER=runner" >> .env
        echo "DB_PASSWORD=runner" >> .env
        echo "DB_HOST=localhost" >> .env
        echo "DB_PORT=5432" >> .env
        echo "CELERY_BROKER_URL=redis://localhost:6379/0" >> .env
        echo "CELERY_RESULT_BACKEND=redis://localhost:6379/0" >> .env

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      run: python manage.py migrate

    - name: Run tests
      run: python manage.py test

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Create .env from ENV_FILE secret
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Validate docker-compose.yml
      run: |
        docker-compose config

    - name: Build Docker images
      run: |
        docker-compose build

  build-and-push:
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
        docker build -t ${{ env.DOCKER_IMAGE }}:latest .

    - name: Push Docker image
      run: |
        docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        docker push ${{ env.DOCKER_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/feature-docker'
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/appuser/project
          
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          
          git fetch --all
          git checkout feature-docker
          git reset --hard origin/feature-docker
          
          if docker ps --format '{{.Names}}' | grep -q habits_db; then
              docker stop habits_db
              docker rm habits_db
          fi
          
          PORT_PID=$(sudo lsof -ti:5432 2>/dev/null || true)
          if [ ! -z "$PORT_PID" ]; then
              sudo kill -9 $PORT_PID
          fi
          
          mkdir -p nginx
          
          echo "${{ secrets.ENV_FILE }}" > .env
          
          docker-compose down
          
          docker-compose pull
          
          docker-compose up -d --build
          
          docker-compose exec -T web python manage.py migrate django_celery_beat --noinput --fake
          
          docker-compose exec -T web python manage.py migrate --noinput
          
          docker-compose exec -T web python manage.py collectstatic --noinput
          
          docker-compose ps
          
          sleep 10
          
          curl -f http://localhost:80/
