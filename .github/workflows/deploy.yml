name: Django CI/CD

on:
  push:
    branches: [feature-docker]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Start PostgreSQL (без health-check)
      run: |
        docker run -d \
          --name postgres-ci \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=test_db \
          -p 5433:5432 \
          postgres:13
        sleep 15

    - name: Start Redis
      run: |
        docker run -d \
          --name redis-ci \
          -p 6380:6379 \
          redis:7-alpine
        sleep 5

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        DEBUG: True
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5433
        ALLOWED_HOSTS: localhost,127.0.0.1
        CELERY_BROKER_URL: redis://localhost:6380/0
      run: |
        python manage.py test

    - name: Cleanup
      run: |
        docker stop postgres-ci redis-ci || true
        docker rm postgres-ci redis-ci || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature-docker'

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/appuser/project
          git pull origin feature-docker
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          sudo systemctl restart gunicorn
          sudo systemctl restart nginx
